# Test profile for the integration tests.
#
# Testcontainers supplies the database via @ServiceConnection, so docker-compose support must
# stay out of the way -- otherwise `mvn verify` would start (and stop) the developer's real
# local stack as a side effect of running tests.
spring.docker.compose.enabled=false

# Nothing is listening on an OTLP endpoint during a test run. Left enabled, the exporters
# retry in the background and bury the test output in connection failures.
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=

# Deterministic MRTR tokens so an elicitation test isn't at the mercy of a per-process key.
# 32 bytes, base64. Test-only value; production sets MOCAPI_MRTR_SECRET.
mocapi.mrtr.secret=bW9jYXBpLWRlbW8tdGVzdC1tcnRyLWtleS0zMmJ5dGU=

# The stub JwtDecoder in McpTestSupport replaces real token validation, so the issuer and JWKS
# endpoints are never contacted. These stay set because the OAuth2 metadata endpoint still
# advertises them.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mocapi-demo
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080/mcp

name: mocapi-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mocapi-demo
      POSTGRES_USER: mocapi
      POSTGRES_PASSWORD: mocapi-dev
    ports:
      - "5432:5432"
    labels:
      org.springframework.boot.service-connection: postgres

  # One container holding an OpenTelemetry Collector plus Tempo (traces),
  # Prometheus (metrics), Loki (logs), and Grafana to view all three. It exists
  # because the demo emits all three OTLP signals and a traces-only backend
  # silently 404s two of them -- metrics every 60s, with a stack trace.
  #
  # Grafana ships this image for demos and local development, explicitly not for
  # production. Real deployments send OTLP to a collector (this app's ACA
  # deployment has one as a pod sidecar) which fans out to whatever backends the
  # org actually runs.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"     # Grafana UI
      - "4318:4318"     # OTLP HTTP  (traces + metrics + logs all land here)
      - "4317:4317"     # OTLP gRPC

  # Keycloak acts as the local OIDC provider. Realm + M2M client are imported
  # from keycloak/mocapi-demo-realm.json on first boot, so a fresh clone has a
  # working token-endpoint with known credentials — no dashboard clicks needed.
  # Ports: 8180 for the IdP (avoids collision with the app on 8080). Dev-mode
  # is fine for local dev; production would use `start` + a real DB.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

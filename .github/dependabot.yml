version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "jwcarman"
    ignore:
      # The OpenTelemetry logback appender must match the opentelemetry-core version Spring Boot
      # manages, NOT the newest release -- Boot's BOM wins import ordering, so a newer appender
      # silently resolves its own core away and then calls methods that aren't there. "Latest" is
      # permanently the wrong answer for this one; see the comment on
      # opentelemetry-instrumentation.version in pom.xml for the version mapping.
      #
      # McpEndpointIntegrationTest#throwingToolReturnsJsonRpcError fails if this is bumped
      # blindly, so a mistake here is a red build rather than a silent 503 on every error path.
      - dependency-name: "io.opentelemetry.instrumentation:*"
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
        update-types:
          - "minor"
          - "patch"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "com.diffplug.spotless*"
          - "com.mycila*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jwcarman"
